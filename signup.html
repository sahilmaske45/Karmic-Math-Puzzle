<!-- This template extends the base layout -->
{% extends "layout.html" %}

<!-- Set the title for this specific page -->
{% block title %}Create an Account{% endblock %}

<!-- Define the main content for the page -->
{% block content %}
<div class="card auth-form">
    <h1 class="title">Create Your Account</h1>
    <p class="intro-text">Join the challenge to track your karmic journey.</p>
    
    <!-- The form posts the data to the /signup route in app.py -->
    <form method="POST" action="{{ url_for('signup') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="4">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        
        <button type="submit" class="btn">✨ Sign Up</button>
    </form>
    
    <p class="auth-switch">
        Already have an account? <a href="{{ url_for('login') }}">Log In here</a>
    </p>
</div>
{% endblock %}
